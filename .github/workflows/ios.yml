name: Build iOS IPA

on:
  push:
    paths:
      - 'flutter_attendance_app/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold iOS Project
        run: |
          cd flutter_attendance_app
          cp ios/Runner/Info.plist /tmp/custom_Info.plist
          flutter create --platforms=ios --project-name=shine_attendance .
          cp /tmp/custom_Info.plist ios/Runner/Info.plist
          flutter pub get
          flutter build ios --config-only

      - name: Build iOS App with Xcode
        run: |
          cd flutter_attendance_app/ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          cd flutter_attendance_app
          APP_PATH=$(find ios/build -name "Runner.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Runner.app" -type d 2>/dev/null | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr ShineAttendance.ipa Payload
          cp ShineAttendance.ipa ../ShineAttendance.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShineAttendance-ipa
          path: ShineAttendance.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          gh release create "ios-v1.0.${BUILD_NUMBER}" ShineAttendance.ipa \
            --title "Shine Attendance iOS 1.0.${BUILD_NUMBER}" \
            --notes "ShineAttendance.ipa for iOS devices (Install using Sideloadly / AltStore / TestFlight)." \
            --target "$GITHUB_SHA" || true
